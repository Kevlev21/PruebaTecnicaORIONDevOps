replicaCount: 1

image:
  repository: orion/service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq-service:5672/"
  REDIS_ADDR: "redis-service:6379"