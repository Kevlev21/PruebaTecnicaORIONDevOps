apiVersion: v1
kind: Service
metadata:
  name: {{ include "orion-platform.fullname" . }}
  labels:
    app.kubernetes.io/name: orion-platform
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: orion-platform